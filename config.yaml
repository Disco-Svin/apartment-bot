# Настройки поиска. Меняйте свободно — правки применятся со следующего запуска.

filters:
  # Список интересующих комнатностей. "От 2-х комнат" = [2, 3, 4, 5].
  # Добавьте 6, если нужны совсем большие квартиры.
  rooms: [2, 3, 4, 5]

  price_max_usd: 100000

  # Нижняя граница цены в USD — отсекает явный мусор в объявлениях
  # (встречаются битые карточки вроде "квартира, $1"). Поставьте 0,
  # чтобы отключить.
  price_min_usd: 3000

  # Курсы для площадок, где цена объявления указана не в USD.
  # Формат: сколько единиц валюты за 1 доллар. Обновляйте по мере
  # необходимости — они влияют на то, попадёт ли объявление в фильтр
  # по цене 100 000$.
  currency_per_usd:
    BYN: 3.3
    EUR: 0.92
    RUB: 90

# Какие площадки опрашивать.
sources:
  kufar: true
  onliner: true
  realt: true
  domovita: true
  gohome: true
  t_s: true # t-s.by ("Твоя Столица")

# Сколько секунд ждать между проверками при непрерывном локальном запуске
# (loop.py). Если бот запускается по расписанию (Планировщик заданий
# Windows, GitHub Actions) — это значение не используется.
poll_interval_seconds: 900

# realt.by не поддерживает серверную сортировку/пагинацию по дате и
# управление размером выдачи — бот забирает единственный доступный срез
# объявлений (~360 штук, размер задаёт сам сайт) и фильтрует его сам.

# domovita.by поддерживает постраничную выдачу — сколько страниц
# (по 20 объявлений) проверять за один прогон.
domovita:
  fetch_pages: 2

# gohome.by и t-s.by (Твоя Столица) — как и realt.by, без надёжной
# сортировки/пагинации по дате на сервере, поэтому тоже best-effort
# покрытие (один доступный срез объявлений за прогон). Даты создания
# объявления у них нет вообще — в today_digest.py эти два источника не
# участвуют.
